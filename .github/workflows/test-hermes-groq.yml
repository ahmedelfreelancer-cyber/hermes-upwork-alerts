name: Hermes Test Run (Groq)

on:
  workflow_dispatch:

jobs:
  test-hermes-groq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Install Hermes Agent (official installer)
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

      - name: Add Hermes to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show Hermes version and diagnostics
        run: |
          hermes --version
          hermes doctor || true

      - name: Configure Hermes for Groq (named custom provider, no default toolsets)
        run: |
          mkdir -p "$HOME/.hermes"
          printf '%s\n' \
            'providers:' \
            '  groq:' \
            '    api: https://api.groq.com/openai/v1' \
            '    key_env: GROQ_API_KEY' \
            '' \
            'model:' \
            '  default: openai/gpt-oss-120b' \
            '  provider: custom:groq' \
            '' \
            'platform_toolsets:' \
            '  cli: []' \
            > "$HOME/.hermes/config.yaml"
          echo "---- config.yaml ----"
          cat "$HOME/.hermes/config.yaml"

      - name: Run Hermes one-shot smoke test (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HERMES_IGNORE_RULES: "1"
        run: |
          OUTPUT=$(hermes -z "Reply with exactly and only these two words: HERMES OK")
          echo "Hermes replied: $OUTPUT"
          echo "$OUTPUT" | grep -q "HERMES OK" && echo "Hermes responded correctly" || (echo "Unexpected output from Hermes" && exit 1)
